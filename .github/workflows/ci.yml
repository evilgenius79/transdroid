name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Protocol tests
        run: ./gradlew :protocol:test

      - name: App unit tests and lint
        run: ./gradlew :app:testFullDebugUnitTest :app:lintFullDebug

      - name: Assemble APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: transdroid-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
