name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (created at the dispatched ref if it doesn't exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > transdroid-release.keystore
            {
              echo "storeFile=transdroid-release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release signing configured"
          else
            echo "No signing secrets; building unsigned APKs"
          fi

      - name: Ensure an installable non-debuggable signing config
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -keystore ci-release.keystore -storepass android -keypass android \
              -alias transdroid -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Transdroid"
            printf 'storeFile=ci-release.keystore\nstorePassword=android\nkeyAlias=transdroid\nkeyPassword=android\n' > keystore.properties
            echo "No release secrets; signing a non-debuggable release APK with an ephemeral key"
          fi

      - name: Test
        run: ./gradlew :protocol:test :app:testFullDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew :app:assembleFullRelease :app:assembleLiteRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/lite/release/*.apk
          generate_release_notes: true
          body: |
            Transdroid 3 alpha. Install **`app-full-release.apk`**. It is a release build
            (`android:debuggable=false`). When repository signing secrets are configured
            (`KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`) that key
            is used; otherwise the APK is signed with an ephemeral CI key and must be
            uninstalled before switching to a differently signed build.
